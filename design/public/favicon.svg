<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F6EF7"/>
      <stop offset="100%" stop-color="#7B5EA7"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.5"/>
    </linearGradient>
  </defs>
  <!-- 배경 -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <!-- 차트 라인 -->
  <polyline
    points="10,46 22,36 32,40 44,22 54,14"
    stroke="white"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.6"
  />
  <!-- 메인 차트 라인 -->
  <polyline
    points="10,46 22,36 32,40 44,22"
    stroke="white"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- 꼭짓점 빛나는 점 -->
  <circle cx="44" cy="22" r="5" fill="white" opacity="0.3"/>
  <circle cx="44" cy="22" r="3" fill="white"/>
  <!-- 작은 스파크 -->
  <line x1="44" y1="14" x2="44" y2="17" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="51" y1="22" x2="48" y2="22" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="49" y1="16" x2="47" y2="18" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
</svg>
